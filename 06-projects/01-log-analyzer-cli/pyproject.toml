[project]
name = "log-analyzer"
version = "0.1.0"
description = "High-performance streaming log analysis CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
log-analyzer = "log_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
